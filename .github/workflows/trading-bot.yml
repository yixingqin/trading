name: Trading Bot

on:
  schedule:
    # 4h candle closes at 9:30, 13:30, 17:30, 21:30 ET → UTC: 13:31, 17:31, 21:31, 01:31
    - cron: "31 13 * * 1-5"
    - cron: "31 17 * * 1-5"
    - cron: "31 21 * * 1-5"
    - cron: "31 1  * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no orders placed)"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Restore state from previous run (positions, tranches sold)
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: trading-state-${{ github.ref_name }}
          restore-keys: trading-state-

      - name: Run scan
        env:
          ROBINHOOD_MCP_URL: ${{ secrets.ROBINHOOD_MCP_URL }}
          ROBINHOOD_API_TOKEN: ${{ secrets.ROBINHOOD_API_TOKEN }}
          TRADING_ACCOUNT_ID: ${{ secrets.TRADING_ACCOUNT_ID }}
          POSITION_SIZE_PCT: "0.05"
          ACCOUNT_SIZE: "5000"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python cli.py scan

      # Persist updated state
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: trading-state-${{ github.ref_name }}-${{ github.run_id }}
