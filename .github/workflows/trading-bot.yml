name: Trading Bot

on:
  schedule:
    # 4h candle closes at 9:30, 13:30, 17:30, 21:30 ET → UTC+0: 13:31, 17:31, 21:31, 01:31
    - cron: "31 13 * * 1-5"
    - cron: "31 17 * * 1-5"
    - cron: "31 21 * * 1-5"
    - cron: "31 1  * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log signals, no orders)"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install anthropic

      # Restore persisted position state from prior run
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: trading-state-${{ github.ref_name }}-latest
          restore-keys: trading-state-${{ github.ref_name }}-

      - name: Run strategy agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROBINHOOD_MCP_URL: https://agent.robinhood.com/mcp/trading
          ROBINHOOD_MCP_TOKEN: ${{ secrets.ROBINHOOD_MCP_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python agent_runner.py

      # Save updated state (positions opened/closed this run)
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: trading-state-${{ github.ref_name }}-latest
